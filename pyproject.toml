[project]
name = "drugpaper"
version = "0.5.0"
description = "Drug paper understanding agent (P5: progressive figure agents and batch understanding)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "jsonpatch>=1.33,<2",
    "jsonpointer>=3.1.1,<4",
    "jsonschema>=4.26.0",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "opencv-python-headless>=5.0.0.93",
    "orjson>=3.12.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pint>=0.26.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.6",
    "redis>=8.1.0",
    "regex>=2026.9.29",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "wordninja>=2.0.0",
]

[project.scripts]
drugpaper = "drugpaper.cli:app"

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.4.171",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pgserver>=0.1.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.10.20260911",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drugpaper"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures", "drugpaper/chem/splicer/vendor.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
# 中文注释/字符串里的全角标点不算问题
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["drugpaper"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["drugpaper"]

[[tool.mypy.overrides]]
module = "drugpaper.*"
strict = true

[[tool.mypy.overrides]]
# PyMuPDF 部分函数没有类型标注
module = ["drugpaper.render.*", "drugpaper.vision.text_layer"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = true


# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: 访问真实模型端点的冒烟测试（默认跳过，用 --smoke 或 make smoke 运行）",
    "integration: 需要 docker-compose 服务的集成测试",
]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["drugpaper.chem.splicer.vendor", "rdkit.*"]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"
