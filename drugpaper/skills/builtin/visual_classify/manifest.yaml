name: visual_classify
version: 0.1.0
kind: prompt
mode:
- pipeline
- agent
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
produces:
  artifact_type: visual_classify
disclosure:
  audiences:
  - figure_agent
  - chat
  - lookup
  toolkit: vision
  triggers:
    intents:
    - visual_classify
    - 图像分类
  invocation: tool_call
model_tasks:
  main: visual_classify
prompts:
  main: prompts/task.md
  images:
  - source: target_crop
    max_side: 768
  includes:
  - common/data_boundary
  - common/no_hallucination
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
budgets:
  max_model_calls: 2
  max_wall_time_s: 120
