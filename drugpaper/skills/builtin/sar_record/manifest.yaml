name: sar_record
version: 0.5.0
kind: python
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
  - chart_panel
produces:
  artifact_type: sar_records
  fact_types:
  - markush_scaffold
  - rgroup_assignment
  - structure_candidate
  - label_claim
tools:
- mol.deliver
- mol.lookup_references
budgets:
  max_model_calls: 0
  max_wall_time_s: 300
disclosure:
  audiences:
  - figure_agent
  - chat
  toolkit: figure_analysis
  triggers:
    image_types:
    - sar_record
    intents:
    - sar_record
  invocation: tool_call
vision_structuring: false
entry: scripts/main.py:run
model_tasks: {}
prompts:
  main: prompts/task.md
