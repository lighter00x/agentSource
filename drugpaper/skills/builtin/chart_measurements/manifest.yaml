name: chart_measurements
version: 0.5.0
kind: python
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
  - chart_panel
produces:
  artifact_type: chart_measurements
  fact_types:
  - measurement
budgets:
  max_model_calls: 0
  max_wall_time_s: 120
disclosure:
  audiences:
  - figure_agent
  - chat
  toolkit: figure_analysis
  triggers:
    image_types:
    - measurement_map
    intents:
    - chart_measurements
  invocation: tool_call
vision_structuring: false
entry: scripts/main.py:run
model_tasks: {}
prompts:
  main: prompts/task.md
