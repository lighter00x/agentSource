name: pharmacophore_model_extract
version: 0.5.1
kind: prompt
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
  - chart_panel
produces:
  artifact_type: pharmacophore_model_extraction
  fact_types: []
budgets:
  max_model_calls: 1
  max_wall_time_s: 2700
disclosure:
  audiences:
  - figure_agent
  - chat
  toolkit: figure_analysis
  triggers:
    image_types:
    - pharmacophore_model
    intents:
    - pharmacophore_model_extract
  invocation: tool_call
vision_structuring: true
model_tasks:
  main: figure_structure
prompts:
  main: prompts/task.md
  images:
  - source: target_crop
    max_side: 1600
  includes:
  - common/data_boundary
  - common/no_hallucination
  - common/mol_reference
  - common/mol_instances
