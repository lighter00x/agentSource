name: table_extract
version: 0.5.2
kind: python
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
  - chart_panel
produces:
  artifact_type: table_grid
  fact_types: []
budgets:
  max_model_calls: 12
  max_wall_time_s: 2700
disclosure:
  audiences:
  - figure_agent
  - chat
  toolkit: figure_analysis
  triggers:
    image_types:
    - table
    intents:
    - table_extract
  invocation: tool_call
vision_structuring: true
entry: scripts/main.py:run
model_tasks:
  main: figure_structure
prompts:
  main: prompts/task.md
