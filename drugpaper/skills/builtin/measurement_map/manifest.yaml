name: measurement_map
version: 0.5.0
kind: python
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
  - chart_panel
produces:
  artifact_type: measurements
  fact_types:
  - measurement
  - assay
budgets:
  max_model_calls: 1
  max_wall_time_s: 300
disclosure:
  audiences:
  - figure_agent
  - chat
  toolkit: figure_analysis
  triggers:
    image_types:
    - measurement_map
    intents:
    - measurement_map
  invocation: tool_call
vision_structuring: false
entry: scripts/main.py:run
model_tasks:
  main: metric_map_fallback
prompts:
  main: prompts/task.md
