name: structure_audit
version: 0.6.0
kind: prompt
input_schema: schemas/input.schema.json
output_schema: schemas/output.schema.json
accepts:
  node_types:
  - figure
  - table
  - scheme
  - figure_part
  - chart_panel
produces:
  artifact_type: structure_audit
  fact_types: []
budgets:
  max_model_calls: 1
  max_wall_time_s: 360
disclosure:
  audiences:
  - figure_agent
  - chat
  toolkit: figure_analysis
  triggers:
    intents:
    - structure_audit
  invocation: tool_call
vision_structuring: true
model_tasks:
  main: figure_structure_review
prompts:
  main: prompts/task.md
  images:
  - source: target_crop
    max_side: 1600
  includes:
  - common/data_boundary
  - common/no_hallucination
  - common/mol_reference
  - common/member_assignment_fields
