[alembic]
script_location = %(here)s/drugpaper/persistence/migrations
prepend_sys_path = .
path_separator = os
# Database URL defaults to DATABASE_URL (drugpaper/config/settings.py); override: alembic -x url=... upgrade head
# Keep this file ASCII-only: configparser uses the locale encoding on Windows.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
